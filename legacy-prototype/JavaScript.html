<script>
const INTERESTS=['Technology','Programming','Gaming','Music','Movies','Education','Sports','Travel','Business','Friendship'];
let sessionToken=localStorage.getItem('sif_token')||'', currentUser=null, currentMatch=null, pollTimer=null, authMode='login';
const $=id=>document.getElementById(id);
function call(action,payload={}){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(r=>{if(r&&r.ok)resolve(r);else reject(new Error(r?.error||'Something went wrong.'));}).withFailureHandler(e=>reject(new Error(e.message||'Server error.'))).api(action,{...payload,token:sessionToken}));}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}
function showAuth(mode){authMode=mode;$('authModal').classList.remove('hidden');renderAuth();}
function closeAuth(){$('authModal').classList.add('hidden');}
function renderAuth(){
 const root=$('authContent');
 if(authMode==='signup'){
 root.innerHTML=`<h2>Create your account</h2><p class="sub">Join the community and start meeting people. You must be 18 or older.</p>
 <form id="signupForm"><div class="field"><label>FULL NAME</label><input name="fullName" required minlength="2" maxlength="80" placeholder="Your name"></div>
 <div class="field-row"><div class="field"><label>MOBILE NUMBER</label><input name="mobile" required inputmode="numeric" pattern="[6-9][0-9]{9}" maxlength="10" placeholder="10-digit number"></div><div class="field"><label>AGE</label><input name="age" type="number" min="18" max="100" required placeholder="18+"></div></div>
 <div class="field"><label>EMAIL ADDRESS</label><input name="email" type="email" required placeholder="you@example.com"></div>
 <div class="field-row"><div class="field"><label>PASSWORD</label><input name="password" type="password" minlength="8" maxlength="128" required placeholder="At least 8 characters"></div><div class="field"><label>CONFIRM PASSWORD</label><input name="confirm" type="password" required placeholder="Repeat password"></div></div>
 <div class="field"><label>GENDER (OPTIONAL)</label><select name="gender"><option value="">Prefer not to say</option><option>Woman</option><option>Man</option><option>Non-binary</option><option>Other</option></select></div>
 <div class="field"><label>YOUR INTERESTS</label><div class="interest-options" id="signupInterests">${INTERESTS.map(x=>`<span class="interest-pill" data-interest="${x}">${x}</span>`).join('')}</div></div>
 <button class="btn primary wide" type="submit">Create account</button></form><div class="form-foot">Already a member? <button class="text-btn" id="switchLogin">Log in</button></div>`;
 $('signupInterests').addEventListener('click',e=>{const p=e.target.closest('[data-interest]');if(p)p.classList.toggle('selected');});
 $('signupForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),v=Object.fromEntries(f.entries());if(v.password!==v.confirm)return toast('Passwords do not match.');v.interests=[...document.querySelectorAll('#signupInterests .selected')].map(x=>x.dataset.interest);if(!v.interests.length)return toast('Select at least one interest.');try{const r=await call('register',v);setSession(r);closeAuth();toast('Welcome! Your account is ready.');}catch(err){toast(err.message);}};
 $('switchLogin').onclick=()=>showAuth('login');
 }else if(authMode==='forgot'){
 root.innerHTML=`<h2>Reset your password</h2><p class="sub">Enter your registered email address.</p><form id="forgotForm"><div class="field"><label>EMAIL ADDRESS</label><input name="email" type="email" required></div><button class="btn primary wide">Request reset</button></form><div class="form-foot"><button class="text-btn" id="switchLogin">Back to login</button></div>`;
 $('forgotForm').onsubmit=async e=>{e.preventDefault();try{const r=await call('forgotPassword',Object.fromEntries(new FormData(e.target)));const tokenMatch=r.message.match(/token: (.+)$/);root.innerHTML=`<h2>Reset request</h2><p class="sub">${escapeHtml(tokenMatch?'A development reset token was generated.':'If the account exists, a reset request has been created.')}</p>${tokenMatch?`<div class="notice">Development token: <b>${escapeHtml(tokenMatch[1])}</b><br>For public launch, deliver this token by verified email instead of displaying it here.</div><form id="resetForm"><div class="field"><label>RESET TOKEN</label><input name="resetToken" required value="${escapeAttr(tokenMatch[1])}"></div><div class="field"><label>NEW PASSWORD</label><input name="newPassword" type="password" minlength="8" maxlength="128" required></div><button class="btn primary wide">Set new password</button></form>`:''}<button class="btn secondary wide" id="switchLogin" style="margin-top:12px">Return to login</button>`;if(tokenMatch){$('resetForm').onsubmit=async ev=>{ev.preventDefault();try{const out=await call('resetPassword',Object.fromEntries(new FormData(ev.target)));toast(out.message);showAuth('login');}catch(err){toast(err.message);}};}$('switchLogin').onclick=()=>showAuth('login');}catch(err){toast(err.message);}};
 $('switchLogin').onclick=()=>showAuth('login');
 }else{
 root.innerHTML=`<h2>Welcome back</h2><p class="sub">Log in to continue making connections.</p><form id="loginForm"><div class="field"><label>EMAIL ADDRESS</label><input name="email" type="email" required placeholder="you@example.com"></div><div class="field"><label>PASSWORD</label><input name="password" type="password" required placeholder="Your password"></div><button class="btn primary wide">Log in</button></form><div class="form-foot"><button class="text-btn" id="forgotLink">Forgot password?</button><br><br>New here? <button class="text-btn" id="switchSignup">Create an account</button></div>`;
 $('loginForm').onsubmit=async e=>{e.preventDefault();try{const r=await call('login',Object.fromEntries(new FormData(e.target)));setSession(r);closeAuth();}catch(err){toast(err.message);}};
 $('switchSignup').onclick=()=>showAuth('signup');$('forgotLink').onclick=()=>showAuth('forgot');
 }
}
function setSession(r){sessionToken=r.token;localStorage.setItem('sif_token',sessionToken);currentUser=r.user;openApp();}
async function restoreSession(){if(!sessionToken)return;try{const r=await call('me');currentUser=r.user;openApp();}catch(e){localStorage.removeItem('sif_token');sessionToken='';}}
function openApp(){ $('landing')?.classList.add('hidden');document.querySelectorAll('main,#about,#safety,.topbar,.footer').forEach(x=>x.classList.add('hidden'));$('appShell').classList.remove('hidden');$('sideName').textContent=currentUser.name;$('sideAvatar').textContent=currentUser.name[0].toUpperCase();showView('dashboard');}
function showView(view){stopPolling();document.querySelectorAll('.side-link[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const titles={dashboard:'Dashboard',random:'Random chat',interest:'Interest chat',profile:'My profile'};$('viewTitle').textContent=titles[view]||'Dashboard';if(view==='dashboard')renderDashboard();if(view==='random'||view==='interest')renderChatStart(view);if(view==='profile')renderProfile();}
function renderDashboard(){$('viewContent').innerHTML=`<div class="welcome-card"><h2>Hey, ${escapeHtml(currentUser.name.split(' ')[0])} 👋</h2><p>Your next great conversation could start with a simple hello.</p><button class="btn secondary" id="dashRandom">Find a random friend →</button></div><div class="action-grid"><article class="action-card"><div class="feature-icon">✧</div><h3>Random chat</h3><p>Meet someone new. No shared topic needed — just say hello.</p><button class="btn primary" id="dashRandom2">Start random chat</button></article><article class="action-card"><div class="feature-icon">✳</div><h3>Interest chat</h3><p>Connect with someone who enjoys the same things you do.</p><button class="btn secondary" id="dashInterest">Find by interests</button></article></div>`;$('dashRandom').onclick=$('dashRandom2').onclick=()=>showView('random');$('dashInterest').onclick=()=>showView('interest');}
function renderChatStart(view){const isInterest=view==='interest';$('viewContent').innerHTML=`<div class="panel"><div class="feature-icon">${isInterest?'✳':'✧'}</div><h3>${isInterest?'Find someone who gets your interests':'Meet someone new'}</h3><p class="muted">${isInterest?'We will look for an available member who shares at least one of your interests.':'We will pair you with another available member at random.'}</p><p class="muted">Your interests: ${currentUser.interests.map(escapeHtml).join(' · ')||'None selected'}</p><button class="btn primary" id="findBtn">${isInterest?'Find an interest match':'Find random friend'}</button><p class="muted" id="matchStatus" style="margin-top:15px"></p></div>`;$('findBtn').onclick=()=>findFriend(isInterest?'INTEREST':'RANDOM');}
async function findFriend(type){$('findBtn').disabled=true;$('matchStatus').textContent='Looking for someone available…';try{const r=await call('findMatch',{matchType:type});currentMatch={...r.match,partner:r.partner};renderActiveChat(r.partner,r.sharedInterests||[]);startPolling();}catch(e){$('matchStatus').textContent=e.message;$('findBtn').disabled=false;}}
function renderActiveChat(partner,shared){$('viewContent').innerHTML=`<div class="chat-layout"><section class="chat-panel"><div class="chat-head"><div><b>${escapeHtml(partner.name)}</b><div class="muted">Matched ${currentMatch.matchType==='INTEREST'?'by shared interests':'randomly'} · <span class="online"></span> Connected</div></div><span class="muted">${partner.age} years</span></div><div class="chat-messages" id="messages"><div class="chat-empty"><div><div class="feature-icon" style="margin:auto">✦</div><strong>Say hello to ${escapeHtml(partner.name.split(' ')[0])}</strong>Start a friendly conversation. Be respectful and keep personal details private.</div></div></div><form class="chat-compose" id="sendForm"><input id="messageInput" maxlength="1000" placeholder="Write a message…" autocomplete="off" required><button class="btn primary">Send</button></form></section><aside class="chat-tools"><div class="panel"><h3>Conversation</h3><p class="muted">${shared.length?'Shared: '+shared.map(escapeHtml).join(', '):'A new connection is waiting.'}</p><button class="btn secondary" id="skipBtn">Next friend</button><button class="btn ghost" id="endBtn" style="margin-top:8px">End chat</button></div><div class="panel"><h3>Safety tools</h3><button class="btn ghost" id="reportBtn">Report user</button><button class="btn ghost" id="blockBtn" style="margin-top:8px">Block user</button></div></aside></div>`;
 $('sendForm').onsubmit=async e=>{e.preventDefault();const input=$('messageInput'),message=input.value.trim();if(!message)return;try{await call('sendMessage',{matchId:currentMatch.matchId,message});input.value='';await loadMessages();}catch(err){toast(err.message);}};
 $('skipBtn').onclick=()=>finishChat(true);$('endBtn').onclick=()=>finishChat(false);$('reportBtn').onclick=reportCurrent;$('blockBtn').onclick=blockCurrent;loadMessages();}
async function loadMessages(){if(!currentMatch)return;try{const r=await call('getMessages',{matchId:currentMatch.matchId});const box=$('messages');if(!box)return;box.innerHTML=r.messages.length?r.messages.map(m=>`<div class="bubble ${m.senderId===currentUser.userId?'mine':''}">${escapeHtml(m.message)}<small>${new Date(m.timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</small></div>`).join(''):`<div class="chat-empty">No messages yet. Break the ice with a hello!</div>`;box.scrollTop=box.scrollHeight;}catch(e){stopPolling();}}
function startPolling(){stopPolling();pollTimer=setInterval(loadMessages,3500);}
function stopPolling(){if(pollTimer)clearInterval(pollTimer);pollTimer=null;}
async function finishChat(next){const priorType=currentMatch?.matchType==='INTEREST'?'interest':'random';stopPolling();try{await call('endMatch',{matchId:currentMatch.matchId});}catch(e){}currentMatch=null;if(next)renderChatStart(priorType);else showView('dashboard');}
async function reportCurrent(){const reason=prompt('Report reason (Harassment, Spam, Inappropriate content, Other):');if(!reason)return;const description=prompt('Optional details:')||'';try{await call('reportUser',{matchId:currentMatch.matchId,reason,description});stopPolling();currentMatch=null;toast('Report submitted. Thank you.');showView('dashboard');}catch(e){toast(e.message);}}
async function blockCurrent(){if(!confirm('Block this person and end the conversation?'))return;try{await call('blockUser',{matchId:currentMatch.matchId});stopPolling();currentMatch=null;toast('User blocked.');showView('dashboard');}catch(e){toast(e.message);}}
function renderProfile(){$('viewContent').innerHTML=`<div class="profile-grid"><section class="panel"><h3>Profile details</h3><form id="profileForm"><div class="field"><label>FULL NAME</label><input name="fullName" value="${escapeAttr(currentUser.name)}" required></div><div class="field-row"><div class="field"><label>AGE</label><input name="age" type="number" min="18" max="100" value="${currentUser.age}" required></div><div class="field"><label>GENDER</label><select name="gender"><option value="">Prefer not to say</option>${['Woman','Man','Non-binary','Other'].map(x=>`<option ${currentUser.gender===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>INTERESTS</label><div class="interest-options" id="profileInterests">${INTERESTS.map(x=>`<span class="interest-pill ${currentUser.interests.includes(x)?'selected':''}" data-interest="${x}">${x}</span>`).join('')}</div></div><button class="btn primary">Save changes</button></form></section><section class="panel"><h3>Account information</h3><p class="muted">Email: ${escapeHtml(currentUser.email||'Hidden')}</p><p class="muted">Your account is active. Your email and mobile number are not shown to chat partners.</p><div class="notice">Keep your profile respectful. Do not add phone numbers, passwords or private information to public chat messages.</div></section></div>`;$('profileInterests').onclick=e=>{const p=e.target.closest('[data-interest]');if(p)p.classList.toggle('selected');};$('profileForm').onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));v.interests=[...document.querySelectorAll('#profileInterests .selected')].map(x=>x.dataset.interest);try{const r=await call('updateProfile',v);currentUser=r.user;toast('Profile updated.');renderProfile();}catch(err){toast(err.message);}};}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function escapeAttr(s){return escapeHtml(s).replace(/`/g,'');}
$('navLogin').onclick=$('heroLogin').onclick=()=>showAuth('login');$('navSignup').onclick=$('heroJoin').onclick=()=>showAuth('signup');$('closeAuth').onclick=closeAuth;$('authModal').onclick=e=>{if(e.target.id==='authModal')closeAuth();};$('logoutBtn').onclick=async()=>{stopPolling();try{await call('logout');}catch(e){}localStorage.removeItem('sif_token');sessionToken='';currentUser=null;location.reload();};document.querySelectorAll('.side-link[data-view]').forEach(b=>b.onclick=()=>showView(b.dataset.view));$('year').textContent=new Date().getFullYear();$('privacyLink').onclick=()=>alert('Privacy: We store account details, chat messages and reports in the configured Google Sheet. Do not use this prototype for sensitive conversations. Contact the site operator for account/data requests.');$('termsLink').onclick=()=>alert('Terms: 18+ only. Be respectful. No harassment, threats, spam, illegal activity or sharing private information. Moderators may restrict accounts and remove abusive content.');
restoreSession();
</script>
