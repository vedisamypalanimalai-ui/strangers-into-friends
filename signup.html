<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join STRANGERS INTO FRIENDS — Create Account</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Header / Navigation -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <div class="logo-icon">💬</div>
        <span>STRANGERS <span class="gradient-text">INTO FRIENDS</span></span>
      </a>

      <div class="nav-actions">
        <span style="font-size: 0.9rem; color: var(--text-secondary);">Already a member?</span>
        <a href="login.html" class="btn btn-outline btn-sm">Sign In</a>
      </div>
    </div>
  </header>

  <!-- Signup Form Section -->
  <main class="auth-page">
    <div class="auth-card" style="max-width: 580px;">
      <div class="auth-header">
        <h1 class="auth-title">Create Your Account</h1>
        <p class="auth-subtitle">Join thousands making real connections worldwide.</p>
      </div>

      <div id="auth-error-box" class="form-error" style="display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); padding: 0.85rem; border-radius: 8px; margin-bottom: 1.25rem; color: #f87171; font-weight: 500;"></div>

      <form id="signup-form">
        <!-- Live Avatar Selection Preview -->
        <div class="avatar-selector-wrap">
          <div class="avatar-preview-box">
            <img id="avatar-preview-img" src="https://ui-avatars.com/api/?name=Stranger&background=7c3aed&color=fff&bold=true" alt="Avatar Preview">
          </div>
          <div style="flex: 1;">
            <label class="form-label">Profile Photo URL (Optional)</label>
            <input type="url" id="profilePicture" class="form-input" placeholder="https://example.com/photo.jpg or leave blank for auto-avatar">
          </div>
        </div>

        <div class="auth-grid-2">
          <div class="form-group">
            <label class="form-label" for="fullName">Full Name *</label>
            <input type="text" id="fullName" class="form-input" placeholder="e.g. Alex Morgan" required minlength="2">
          </div>

          <div class="form-group">
            <label class="form-label" for="username">Username *</label>
            <input type="text" id="username" class="form-input" placeholder="e.g. alex_m" required pattern="^[a-zA-Z0-9_]{3,25}$" title="3-25 letters, numbers, or underscores">
          </div>
        </div>

        <div class="auth-grid-2">
          <div class="form-group">
            <label class="form-label" for="email">Email Address *</label>
            <input type="email" id="email" class="form-input" placeholder="alex@example.com" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="mobile">Mobile Number *</label>
            <input type="tel" id="mobile" class="form-input" placeholder="+1 555 123 4567" required>
          </div>
        </div>

        <div class="auth-grid-2">
          <div class="form-group">
            <label class="form-label" for="password">Password *</label>
            <input type="password" id="password" class="form-input" placeholder="At least 6 characters" required minlength="6">
          </div>

          <div class="form-group">
            <label class="form-label" for="dateOfBirth">Date of Birth (18+ Only) *</label>
            <input type="date" id="dateOfBirth" class="form-input" required>
          </div>
        </div>

        <div class="auth-grid-2">
          <div class="form-group">
            <label class="form-label" for="gender">Gender</label>
            <select id="gender" class="form-select">
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Non-binary">Non-binary</option>
              <option value="Prefer not to say" selected>Prefer not to say</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="location">Location / City (Optional)</label>
            <input type="text" id="location" class="form-input" placeholder="e.g. New York, USA">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="bio">Short Bio (Optional)</label>
          <textarea id="bio" class="form-textarea" placeholder="Tell strangers a little bit about yourself, your hobbies, or what you like to talk about..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
          Create Account & Join
        </button>

        <p class="auth-footer">
          By signing up, you verify that you are at least 18 years old and agree to treat strangers with respect and kindness.
        </p>
      </form>
    </div>
  </main>

  <script src="/socket.io/socket.io.js" onerror="console.info('Socket.IO offline or local mode')"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
